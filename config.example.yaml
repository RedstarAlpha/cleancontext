# CleanContext — example configuration
# Add this under dual_llm: in your agent's config.yaml

dual_llm:
  # Master switch
  enabled: true

  # Routing policy for blocked tools:
  #   delegate  — route to worker, mind receives clean summary  (recommended)
  #   allow     — mind executes all tools directly (CleanContext off)
  #   ops_only  — worker executes, result not returned to mind
  #   block     — blocked tool calls raise an error (useful for testing)
  direct_operations_policy: delegate

  # Mind model — reasoning, conversation, final responses
  mind:
    provider: openai
    model: gpt-4o

  # Operations worker — executes tools silently, returns summaries
  # Use a smaller/faster model here to keep costs down
  operations:
    provider: openai
    model: gpt-4o-mini
    toolsets:
      - terminal
      - file
      - web
      - browser

  # Tools the mind may call directly
  # (reasoning, memory, coordination — low context noise)
  allowed_mind_tools:
    - clarify
    - delegate_task
    - memory
    - read_file
    - search_files
    - todo

  # Tools routed to the operations worker
  # (high output volume — terminal logs, file contents, HTTP responses)
  blocked_direct_tools:
    - browser_back
    - browser_click
    - browser_console
    - browser_navigate
    - browser_scroll
    - browser_snapshot
    - browser_type
    - cronjob
    - execute_code
    - image_generate
    - patch
    - process
    - send_message
    - terminal
    - vision_analyze
    - web_extract
    - web_search
    - write_file
